# Verification phase for the reviewed house tool-choice candidate.
# This deliberately reuses a dispatchable workflow path from the default branch;
# nothing is installed or deployed on an operator or production server.
name: Verify OmniRoute cumulative house image

on:
  push:
    branches: [fix/house-cortecs-usd-20261109]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Exact published image digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-house-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMAGE: ghcr.io/tiangao88/omniroute@${{ inputs.image_digest }}
      SOURCE_COMMIT: d73bf03a412a75aedd8a8432ccfa407412004acd
      CONTAINER: omniroute-house-cumulative-image-smoke
    steps:
      - name: Pull exact public image and boot with no network or production data
        run: |
          set -euo pipefail
          [[ "$IMAGE" =~ ^ghcr\.io/tiangao88/omniroute@sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}'
          docker run -d --name "$CONTAINER" --network none \
            --memory 1536m --cpus 2 --pids-limit 512 \
            --tmpfs /app/data:rw,nosuid,nodev,size=128m,uid=1000,gid=1000 \
            -e NEXT_TELEMETRY_DISABLED=1 "$IMAGE"
      - name: Verify boot, shipped healthcheck, native SQLite and CLI pin
        shell: python
        run: |
          import json, os, subprocess, time, pathlib
          container = os.environ['CONTAINER']
          report = {'image': os.environ['IMAGE'], 'sourceCommit': os.environ['SOURCE_COMMIT'], 'network': 'none', 'data': 'fresh tmpfs', 'checks': []}
          def run(args, allow_fail=False):
              p = subprocess.run(args, text=True, capture_output=True, timeout=25)
              if not allow_fail and p.returncode:
                  raise RuntimeError('Command failed: ' + ' '.join(args) + '; rc=' + str(p.returncode) + '; ' + p.stderr[-1500:])
              return p
          def node(code):
              return run(['docker', 'exec', container, 'node', '--input-type=module', '-e', code])
          def record(name, details):
              report['checks'].append({'name': name, 'result': 'pass', 'details': details})
              pathlib.Path('smoke-report.json').write_text(json.dumps(report, indent=2))
              print(json.dumps(report['checks'][-1]))
          code = "const r=await fetch('http://127.0.0.1:20128/healthz',{signal:AbortSignal.timeout(4000)}); console.log(JSON.stringify({status:r.status,body:await r.text()}));"
          for attempt in range(45):
              p = run(['docker', 'exec', container, 'node', '--input-type=module', '-e', code], allow_fail=True)
              if not p.returncode:
                  health = json.loads(p.stdout)
                  if health['status'] == 200 and health['body'] == 'ok\n':
                      break
              state = json.loads(run(['docker', 'inspect', container, '--format', '{{json .State}}']).stdout)
              if not state['Running']:
                  raise RuntimeError('Container exited; state=' + json.dumps(state))
              time.sleep(3)
          else:
              raise RuntimeError('Published image did not become ready')
          record('GET /healthz', health)
          run(['docker', 'exec', container, 'node', 'healthcheck.mjs'])
          record('shipped healthcheck', 'exit 0')
          # Ensure the shipped checker rejects a deliberately wrong endpoint.
          negative = run(['docker', 'exec', '-e', 'OMNIROUTE_HEALTHCHECK_PATH=/__missing_smoke_endpoint__', container, 'node', 'healthcheck.mjs'], allow_fail=True)
          assert negative.returncode != 0, 'Healthcheck accepted missing endpoint'
          record('negative healthcheck guard', {'exit_code': negative.returncode})
          native = node("import {createRequire} from 'node:module'; const require=createRequire('/app/package.json'); const Database=require('better-sqlite3'); const db=new Database(':memory:'); console.log(JSON.stringify({node:process.version,sqlite:db.prepare('select sqlite_version() as version').get().version})); db.close();")
          record('native SQLite binding', json.loads(native.stdout))
          version = node("import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('/usr/local/lib/node_modules/@openai/codex/package.json','utf8')); if(p.version!=='0.165.0') throw new Error('Wrong Codex pin: '+p.version); console.log(JSON.stringify({codex:p.version}));")
          record('Codex CLI pin', json.loads(version.stdout))
          auth = node("const r=await fetch('http://127.0.0.1:20128/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'__smoke_only__',messages:[{role:'user',content:'smoke'}]}),signal:AbortSignal.timeout(8000)}); if(r.status!==401 && r.status!==403) throw new Error('Expected auth rejection, got '+r.status); console.log(JSON.stringify({status:r.status}));")
          record('unauthenticated LLM request rejected', json.loads(auth.stdout))
          billing = node("import fs from 'node:fs'; import {createRequire} from 'node:module'; const require=createRequire('/app/package.json'); const Database=require('better-sqlite3'); const pkg=JSON.parse(fs.readFileSync('/app/package.json','utf8')); if(pkg.version!=='3.8.53') throw new Error('Wrong application version'); if(!fs.existsSync('/app/migrations/228_usage_history_calculated_cost.sql')) throw new Error('Missing billing migration'); const db=new Database('/app/data/storage.sqlite',{readonly:true}); const columns=db.prepare('PRAGMA table_info(usage_history)').all().map(r=>r.name); const expected=['calculated_cost_usd','billing_unit','billing_quantity','billing_unit_price_usd']; if(expected.some(c=>!columns.includes(c))) throw new Error('Billing columns absent'); const migration=db.prepare('SELECT version,name FROM _omniroute_migrations WHERE version = ?').get('228'); if(!migration) throw new Error('Billing migration not applied'); console.log(JSON.stringify({version:pkg.version,node:process.version,columns:expected,migration})); db.close();")
          record('application version and document-billing migration', json.loads(billing.stdout))
          compiled = node("import fs from 'node:fs'; import path from 'node:path'; const wanted=['X-OmniRoute-Cost-Status','Billing persistence failed','/api/v1/generation','CORTECS_CREDIT_PRICE_USD','annotation_cost_per_page','x-cortecs-cost-unit']; const found=new Set(); function scan(dir){ if(!fs.existsSync(dir))return; for(const e of fs.readdirSync(dir,{withFileTypes:true})){ if(found.size===wanted.length)return; const p=path.join(dir,e.name); if(e.isDirectory())scan(p); else if(e.isFile() && /\\.m?js$/.test(e.name)){const s=fs.readFileSync(p,'utf8');for(const v of wanted)if(s.includes(v))found.add(v);}}} scan('/app/.next/server');scan('/app/.build/next/server');if(found.size!==wanted.length)throw new Error('Compiled media accounting markers absent');console.log(JSON.stringify({markers:[...found]}));")
          record('compiled cumulative accounting implementation', json.loads(compiled.stdout))
          # Synthetic rows and a read-only token exist only in this network-none
          # disposable tmpfs. No production key, model or database is used.
          paris = node("""
          import {createRequire} from 'node:module';
          import {randomBytes,randomUUID,createHash} from 'node:crypto';
          const require=createRequire('/app/package.json'),Database=require('better-sqlite3');
          const db=new Database('/app/data/storage.sqlite');
          const token='oma_live_'+randomBytes(32).toString('base64url');
          db.prepare('INSERT INTO cli_access_tokens (id,token_hash,token_prefix,name,scope,created_at) VALUES (?,?,?,?,?,?)').run('tok_'+randomUUID(),createHash('sha256').update(token).digest('hex'),token.slice(0,12),'isolated-paris-smoke','read',new Date().toISOString());
          const insert=db.prepare('INSERT INTO usage_history (timestamp,provider,model,tokens_input,tokens_output,success,calculated_cost_usd) VALUES (?,?,?,?,?,?,?)');
          for(const stamp of ['2026-01-31T23:30:00.000Z','2026-07-31T22:30:00.000Z','2026-03-29T22:30:00.000Z','2026-10-25T22:30:00.000Z'])insert.run(stamp,'fixture','paris-fixture',10,5,1,1);
          db.close();
          const cases=[['2026-01-31','2026-02-02','2026-02-01'],['2026-07-31','2026-08-02','2026-08-01'],['2026-03-29','2026-03-31','2026-03-30'],['2026-10-25','2026-10-27','2026-10-25']];
          for(const [start,end,day] of cases){
            const query=new URLSearchParams({startDate:start+'T00:00:00Z',endDate:end+'T00:00:00Z',timeZone:'Europe/Paris',includeFlatRateEstimates:'false'});
            const r=await fetch('http://127.0.0.1:20128/api/usage/analytics?'+query,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(8000)});
            if(r.status!==200)throw Error('Paris HTTP status '+r.status);
            const b=await r.json();
            if(b.reporting?.version!==1||b.reporting.timeZone!=='Europe/Paris'||b.dailyTrend.length!==1||b.dailyTrend[0].date!==day||b.dailyTrend[0].requests!==1||b.dailyTrend[0].cost!==1)throw Error('Paris calendar/cost mismatch');
          }
          console.log(JSON.stringify({readScope:true,calendarCases:cases.length,includesWinterSummerAndBothDstTransitions:true,data:'synthetic-tmpfs-only'}));
          """)
          record('native SQLite Paris HTTP reporting', json.loads(paris.stdout))
          for _ in range(12):
              state = json.loads(run(['docker', 'inspect', container, '--format', '{{json .State}}']).stdout)
              if state.get('Health', {}).get('Status') == 'healthy':
                  break
              time.sleep(5)
          assert state['Running'] and state.get('Health', {}).get('Status') == 'healthy', 'Docker did not mark image healthy'
          record('Docker HEALTHCHECK state', {'running': state['Running'], 'health': state['Health']['Status'], 'oom_killed': state['OOMKilled']})
          report['result'] = 'pass'
          pathlib.Path('smoke-report.json').write_text(json.dumps(report, indent=2))
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-image-smoke-report
          path: smoke-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only the disposable test container
        if: always()
        run: docker rm -f "$CONTAINER" || true

  source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d73bf03a412a75aedd8a8432ccfa407412004acd
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --include=optional --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck:core
      - run: npm run test:vitest
      - name: Cumulative accounting, reporting and finalizer regressions
        run: >-
          node --import tsx/esm --import ./tests/_setup/isolateDataDir.ts --test-force-exit --test
          tests/unit/cortecs-rerank-accounting.test.ts
          tests/unit/cortecs-rerank-credits.test.ts
          tests/unit/cortecs-rerank-usd.test.ts
          tests/unit/cortecs-rerank-pricing-scope.test.ts
          tests/unit/api-key-usage-limits.test.ts
          tests/unit/provider-window-costs.test.ts
          tests/unit/ocr-embedding-cost-tracking.test.ts
          tests/unit/pricingSync.modal.test.ts
          tests/unit/media-cost-tracking.test.ts
          tests/unit/speech-usage.test.ts
          tests/unit/kiro-credits.test.ts
          tests/unit/analytics-reporting-time-zone.test.ts
          tests/unit/db-usage-analytics-3500.test.ts
          tests/unit/usage-analytics-route.test.ts
          tests/unit/usage-analytics-pricing-memoization.test.ts
          tests/unit/usage-analytics-response-cache.test.ts
          tests/unit/tool-choice-schema-normalization.test.ts
          tests/unit/responses-to-chat-no-tools-tool-choice-12141.test.ts
          tests/integration/tool-choice-none-outbound.test.ts
      - run: npm run check:docs-all
