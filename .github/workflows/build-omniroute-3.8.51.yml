# Build & publish the house OmniRoute image from the fork's release/v3.8.51 line.
#
# Output: ghcr.io/tiangao88/omniroute:<tag>   (default tag: 3.8.51)
#
# Trigger:
#   - push to release/v3.8.51  -> rebuilds :3.8.51
#   - manual dispatch          -> custom ref + tag (used for patched variants)
#
# GHCR push uses the repo's built-in token with packages: write. The package must
# stay public so Coolify pulls it without embedding registry credentials.

name: Build & Publish OmniRoute (3.8.51)

on:
  push:
    branches:
      - release/v3.8.51
  workflow_dispatch:
    inputs:
      build_ref:
        description: Git ref to build
        required: false
        default: release/v3.8.51
        type: string
      image_tag:
        description: Image tag to publish
        required: false
        default: 3.8.51
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tiangao88/omniroute

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build parameters
        id: params
        run: |
          echo "ref=${{ inputs.build_ref || 'release/v3.8.51' }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.image_tag || '3.8.51' }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.params.outputs.tag }}
