name: House Paris reporting regressions
on:
  pull_request:
    branches: [house/v3.8.53-paris-reporting]
permissions:
  contents: read
concurrency:
  group: paris-reporting-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.suite }}
    if: github.repository == 'tiangao88/OmniRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [test:vitest, check:docs-all]
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --include=optional --legacy-peer-deps --no-audit --no-fund
      - run: npm run "${SUITE}"
        env:
          SUITE: ${{ matrix.suite }}
  unit:
    name: test:unit (${{ matrix.shard }}/8)
    if: github.repository == 'tiangao88/OmniRoute'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Same full three-phase runner and fixtures as upstream ci.yml. Every
      # shard must pass; no test pattern, assertion or failure is suppressed.
      JWT_SECRET: ci-test-secret-with-sufficient-length-for-validation
      API_KEY_SECRET: ci-test-api-key-secret-long
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      ONNXRUNTIME_NODE_INSTALL: skip
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.12.1"
          cache: npm
      - run: npm ci --include=optional --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:unit:ci:shard
